<section class="w-full bg-white py-30">
  <div class="max-w-6xl mx-auto px-6 flex items-center justify-between gap-0">
    <div class="flex-1 flex justify-center">
      <img [src]="imageUrl" alt="Introducing Stocks" class="w-full max-w-85 object-contain" />
    </div>

    <div class="flex-1 max-w-95">
      <p class="text-[18px] font-semibold text-[#44475b] mb-3">
        {{ introText }}
      </p>

      <h1 class="text-[32px] leading-none font-bold text-[#44475b] mb-10">
        {{ title }}
      </h1>

      <p class="text-[14px] text-[#7c7e8c] leading-relaxed mb-10">
        {{ description }}
      </p>

      <button
        class="bg-[#00d09c] hover:bg-[#00bc8d] text-white font-bold text-[16px] px-4 py-2 rounded-xl transition-all"
      >
        {{ buttonText }}
      </button>
    </div>
  </div>
</section>
