<div
  class="font-sans bg-white rounded-2xl shadow-md max-w-6xl mx-auto my-28 py-4 overflow-hidden border border-gray-300"
>
  <!-- Tab bar -->
  <div class="flex items-center gap-0 border-b border-gray-300 px-6">
    <div
      class="py-4.5 pb-3.5 font-bold text-[15px] text-gray-900 border-b-[2.5px] border-gray-900 mr-6 cursor-pointer"
    >
      Barani's Watchlist
    </div>
    <div
      class="py-4.5 pb-3.5 font-semibold text-sm text-emerald-500 cursor-pointer flex items-center gap-1"
    >
      <span class="text-lg leading-none">+</span> Watchlist
    </div>
  </div>

  <!-- Search + Actions -->
  <div class="flex items-center justify-between px-6 py-4 border-b border-gray-50">
    <div
      class="flex items-center gap-2 bg-gray-50 border border-gray-200 rounded-lg px-3.5 py-2 w-64"
    >
      <svg width="15" height="15" viewBox="0 0 15 15" fill="none">
        <circle cx="6.5" cy="6.5" r="5" stroke="#aaa" stroke-width="1.4" />
        <line x1="10.5" y1="10.5" x2="14" y2="14" stroke="#aaa" stroke-width="1.4" />
      </svg>
      <input
        [(ngModel)]="search"
        placeholder="Search your watchlist"
        class="bg-transparent border-none outline-none text-[13.5px] text-gray-600 w-full"
      />
    </div>
  </div>

  <!-- Table -->
  <table class="w-full border-collapse">
    <thead>
      <tr class="border-b border-gray-100 text-[12.5px] text-gray-400">
        <th class="px-4 py-2.5 text-left">Company ({{ filtered().length }})</th>
        <th class="px-4 py-2.5 text-left">Trend</th>
        <th class="px-4 py-2.5 text-right">Mkt price</th>
        <th class="px-4 py-2.5 text-right">1D change</th>
        <th class="px-4 py-2.5 text-right">1D vol</th>
        <th class="px-4 py-2.5 text-right">52W perf</th>
      </tr>
    </thead>
    <tbody>
      @for (stock of filtered(); track stock.id; let last = $last) {
        <tr class="transition-colors duration-150 hover:bg-gray-50" [class.border-b]="!last">
          <td class="px-4 py-4.5">
            <div class="flex items-center gap-3">
              <!-- Re-use your CompanyLogo component logic here -->
              <span class="text-[14.5px] font-semibold text-gray-900">{{ stock.name }}</span>
            </div>
          </td>
          <td class="px-4 py-4.5">
            <!-- Re-use SparkLine component -->
          </td>
          <td class="px-4 py-4.5 text-right font-medium text-gray-900">{{ stock.price }}</td>
          <td class="px-4 py-4.5 text-right text-[13.5px] font-medium text-[#d63c1a]">
            {{ stock.change }} ({{ stock.changePct }})
          </td>
          <td class="px-4 py-4.5 text-right text-[13.5px] text-gray-600">{{ stock.volume }}</td>
          <td class="px-4 py-4.5 text-right">
            <!-- Re-use FiftyTwoWeekBar component -->
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>
