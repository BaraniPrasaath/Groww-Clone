<div class="max-w-225 p-4 font-sans ml-4">
  <h2 class="text-[22px] font-medium text-slate-800 mb-5 tracking-tight">Top movers today</h2>

  <div class="flex items-center gap-3 mb-6">
    <button
      *ngFor="let item of movers"
      (click)="onClick(item.value)"
      class="px-5 py-2.5 rounded-full border text-[#44475b] text-xs font-medium transition-all cursor-pointer"
      [class.border-[#44475b]]="selectedMover() === item.value"
      [class.bg-[#f8f9fa]]="selectedMover() === item.value"
      [class.shadow-sm]="selectedMover() === item.value"
      [class.border-[#e8e9eb]]="selectedMover() !== item.value"
      [class.bg-white]="selectedMover() !== item.value"
    >
      {{ item.label }}
    </button>
    <div class="">
      <button
        (click)="toggleDropdown()"
        [ngClass]="isDropdownOpen() ? 'border-[#44475b] bg-gray-50' : 'border-[#e8e9eb] bg-white'"
        class="px-5 py-2 rounded-full border text-[#44475b] text-sm flex items-center gap-2 hover:border-[#44475b] transition-all duration-200 cursor-pointer"
      >
        {{ getSelectedIndexLabel() }}
        <i
          class="fa-solid transition-transform duration-200 text-xs text-gray-500"
          [ngClass]="isDropdownOpen() ? 'fa-angle-up' : 'fa-angle-down'"
        ></i>
      </button>

      @if (isDropdownOpen()) {
        <div
          class="absolute right-175 mt-2 w-50 bg-white border border-[#e8e9eb] rounded-2xl shadow-xl py-2 z-50 animate-fade-in"
        >
          @for (option of indexOptions; track option.value) {
            <button
              (click)="selectIndex(option.value)"
              class="w-full px-5 py-3 text-left flex items-center gap-3 hover:bg-slate-50 transition-colors duration-150 group"
            >
              <div
                [ngClass]="
                  selectedIndex() === option.value
                    ? 'border-[#00d09c]'
                    : 'border-gray-300 group-hover:border-gray-400'
                "
                class="w-4.5 h-4.5 rounded-full border-2 flex items-center justify-center transition-all"
              >
                @if (selectedIndex() === option.value) {
                  <div class="w-2 h-2 rounded-full bg-[#00d09c]"></div>
                }
              </div>

              <span
                [ngClass]="
                  selectedIndex() === option.value
                    ? 'text-slate-900 font-medium'
                    : 'text-[#44475b] font-normal'
                "
                class="text-[14px]"
              >
                {{ option.label }}
              </span>
            </button>
          }
        </div>

        <div class="fixed inset-0 z-40 bg-transparent" (click)="toggleDropdown()"></div>
      }
    </div>
  </div>

  <div class="border border-[#e8e9eb] rounded-xl overflow-hidden bg-white shadow-sm">
    <div
      class="grid grid-cols-[1.5fr_1fr_1.2fr_1fr] px-5 py-4 bg-[#f8f9fa] border-b border-[#e8e9eb] text-[11px] text-[#7b809a] font-medium"
    >
      <div class="pl-2 text-center">Company</div>
      <div></div>
      <div class="text-right">Market price (1D)</div>
      <div class="text-right pr-2">Volume</div>
    </div>

    <div class="flex flex-col">
      <div
        *ngFor="let stock of stocks()"
        class="group grid grid-cols-[1.5fr_1fr_1.2fr_1fr] items-center px-5 py-4 border-b border-[#e8e9eb] last:border-b-0 hover:bg-[#f8f9fa] transition-colors cursor-pointer relative"
      >
        <div class="flex items-center gap-4 pl-2">
          <div
            class="w-10 h-10 rounded border border-[#e8e9eb] overflow-hidden flex items-center justify-center p-0.5 bg-white"
          >
            <img [src]="stock.logo" [alt]="stock.name" class="w-full h-full object-contain" />
          </div>
          <span class="font-medium text-[12px] text-[#44475b]">{{ stock.name }}</span>
        </div>

        <div class="flex items-center justify-center relative w-full h-8 px-4">
          <svg preserveAspectRatio="none" viewBox="0 0 100 30" class="w-full h-full">
            <path
              d="M0,20 L10,18 L20,22 L30,15 L40,16 L50,10 L60,12 L70,5 L80,8 L90,2 L100,0"
              fill="none"
              stroke="#00b386"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <line
              x1="0"
              y1="28"
              x2="100"
              y2="28"
              stroke="#d1d5db"
              stroke-width="1"
              stroke-dasharray="2 2"
            />
          </svg>
        </div>

        <div class="text-right flex flex-col justify-center">
          <span class="font-light text-[15px] text-[#44475b]">{{
            stock.price | currency: 'INR'
          }}</span>
          <span class="text-[13px] font-medium text-[#00b386] mt-0.5"
            >{{ stock.change }} {{ stock.changePercent }}</span
          >
        </div>

        <div class="text-right pr-2 relative flex items-center justify-end h-full">
          <span
            class="text-[14px] font-normal text-[#44475b] group-hover:opacity-0 transition-opacity duration-200"
          >
            {{ stock.volume }}
          </span>

          <div
            class="absolute right-0 top-1/2 -translate-y-1/2 flex items-center gap-3 opacity-0 group-hover:opacity-100 transition-opacity duration-200 pointer-events-none group-hover:pointer-events-auto"
          >
            <button
              class="w-8.5 h-8.5 rounded-lg bg-white border border-[#e8e9eb] flex items-center justify-center text-gray-500 hover:text-green-600 hover:border-green-600"
            >
              <i class="fa-solid fa-diagram-project"></i>
            </button>
            <button
              class="w-8.5 h-8.5 rounded-lg bg-white border border-[#e8e9eb] flex items-center justify-center text-gray-500 hover:text-green-600 hover:border-green-600 shadow-sm transition-colors"
            >
              <i class="fa-regular fa-bookmark"></i>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="mt-5" routerLink="/markets/top-gainers">
    <a
      class="inline-flex items-center gap-1 text-[14px] font-semibold text-[#00b386] hover:underline cursor-pointer"
    >
      See more
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="h-4 w-4"
        viewBox="0 0 20 20"
        fill="currentColor"
      >
        <path
          fill-rule="evenodd"
          d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z"
          clip-rule="evenodd"
        />
      </svg>
    </a>
  </div>
</div>
