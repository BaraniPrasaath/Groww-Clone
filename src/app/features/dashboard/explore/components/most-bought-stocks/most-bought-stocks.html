<div class="max-w-4xl ml-4 p-4 font-sans">
  <h2 class="text-xl font-medium text-gray-800 mb-4">Most bought stocks on Groww</h2>

  <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-4">
    <app-news-card
      *ngFor="let stock of stocks()"
      [stock]="stock"
    >
    </app-news-card>
  </div>

  <div
    class="mt-6 text-[#00b386] text-sm font-semibold cursor-pointer hover:underline inline-flex items-center"
    routerLink="/stocks/most-bought-stocks-on-groww"
  >
    See more
    <svg
      xmlns="http://www.w3.org/2000/svg"
      class="h-4 w-4 ml-1"
      fill="none"
      viewBox="0 0 24 24"
      stroke="currentColor"
    >
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
    </svg>
  </div>
</div>
