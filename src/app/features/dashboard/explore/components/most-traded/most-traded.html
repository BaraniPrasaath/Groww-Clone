<div class="max-w-4xl ml-4 p-4 font-sans">
  <h2 class="text-xl font-medium text-gray-800 mb-4">Most traded stocks in MTF</h2>

  <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-4">
    <app-news-card *ngFor="let stock of stocks()" [stock]="stock"> </app-news-card>
  </div>

  <div
    class="mt-6 text-[#00b386] text-sm font-semibold cursor-pointer hover:underline items-center"
    routerLink="/stocks/mtf/most-traded"
  >
    See more
    <i class="fa-solid fa-angle-right ml-1"></i>
  </div>
</div>
