<div
  class="relative w-full max-w-4xl min-h-95 bg-white border border-gray-100 rounded-xl shadow-sm p-10 overflow-hidden flex items-center"
>
  <form (ngSubmit)="onSubmit()" class="w-full max-w-md z-10 flex flex-col gap-8">
    <div class="flex flex-col gap-1.5">
      <label class="text-[11px] font-bold tracking-wider text-slate-400 uppercase">
        New Password
      </label>
      <div class="relative w-full">
        <input
          [type]="showNewPassword ? 'text' : 'password'"
          [(ngModel)]="newPassword"
          name="newPassword"
          placeholder="Password"
          class="w-full py-2 bg-transparent border-b border-slate-300 text-slate-700 placeholder-slate-400 focus:outline-none focus:border-emerald-500 transition-colors pr-8 text-sm"
          required
        />
        <button
          type="button"
          (click)="toggleNewPassword()"
          class="absolute right-0 bottom-2 text-slate-600 hover:text-slate-800 focus:outline-none"
          aria-label="Toggle password visibility"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="2.5"
            stroke="currentColor"
            class="w-4 h-4"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z"
            />
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"
            />
          </svg>
        </button>
      </div>
    </div>

    <div class="flex flex-col gap-1.5">
      <label class="text-[11px] font-bold tracking-wider text-slate-400 uppercase">
        Confirm New Password
      </label>
      <div class="relative w-full">
        <input
          [type]="showConfirmPassword ? 'text' : 'password'"
          [(ngModel)]="confirmPassword"
          name="confirmPassword"
          placeholder="Password"
          class="w-full py-2 bg-transparent border-b border-slate-300 text-slate-700 placeholder-slate-400 focus:outline-none focus:border-emerald-500 transition-colors pr-8 text-sm"
          required
        />
        <button
          type="button"
          (click)="toggleConfirmPassword()"
          class="absolute right-0 bottom-2 text-slate-600 hover:text-slate-800 focus:outline-none"
          aria-label="Toggle password visibility"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="2.5"
            stroke="currentColor"
            class="w-4 h-4"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z"
            />
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"
            />
          </svg>
        </button>
      </div>
    </div>

    <button
      type="submit"
      class="w-fit bg-[#00b087] hover:bg-[#009672] text-white font-medium text-sm px-5 py-2.5 rounded-lg transition-colors shadow-sm focus:outline-none mt-2"
    >
      Update Password
    </button>
  </form>

  <div
    class="absolute right-0 top-0 bottom-0 w-1/2 bg-no-repeat bg-right bg-contain pointer-events-none"
    style="
      background-image: url('https://assets-netstorage.groww.in/web-assets/billion_groww_desktop/prod/_next/static/media/bg.5f4e9d68.svg');
    "
  ></div>
</div>
