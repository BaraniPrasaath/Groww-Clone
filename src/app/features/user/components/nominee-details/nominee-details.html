<div class="max-w-4xl mx-auto w-full p-6 font-sans flex flex-col gap-6">
  <div
    class="bg-white border border-gray-200 rounded-xl p-8 shadow-sm flex flex-col items-center text-center"
  >
    <div class="mb-4">
      <img
        src="https://assets-netstorage.groww.in/web-assets/billion_groww_desktop/prod/_next/static/media/noNomineeImg.ab52dadf.svg"
        alt="Nominee Setup Alert Illustration"
        class="w-24 h-auto"
      />
    </div>

    <h2 class="text-base font-semibold text-slate-800 mb-1">
      Complete setting up your account to add nominee
    </h2>
    <p class="text-xs text-slate-400 mb-6">Complete your account set up to add nominee</p>

    <button
      type="button"
      (click)="onCompleteSetup()"
      class="w-full bg-[#00b087] hover:bg-[#009672] text-white font-medium text-sm py-2.5 rounded-lg transition-colors shadow-sm focus:outline-none"
    >
      Complete Setup
    </button>
  </div>

  <div class="flex flex-col gap-3">
    <h3 class="text-base font-semibold text-slate-800 px-1">FAQs</h3>

    <div class="bg-white border border-gray-200 rounded-xl p-5 shadow-sm">
      <button
        type="button"
        (click)="toggleFaq()"
        class="w-full flex justify-between items-center text-left focus:outline-none text-[14px] font-medium text-slate-500 hover:text-slate-700 transition-colors"
      >
        <span>Why are nominees important?</span>

        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="2.5"
          stroke="currentColor"
          class="w-3.5 h-3.5 text-slate-400 transition-transform duration-300 ease-in-out"
          [ngClass]="isFaqOpen ? 'rotate-180' : 'rotate-0'"
        >
          <path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5" />
        </svg>
      </button>

      <div
        class="grid transition-all duration-300 ease-in-out"
        [ngClass]="isFaqOpen ? 'grid-rows-[1fr] opacity-100' : 'grid-rows-[0fr] opacity-0'"
      >
        <div class="overflow-hidden">
          <p class="pt-4 text-[13px] text-slate-500 leading-relaxed pr-6">
            Nominees get your investments in the event of unforeseen circumstances. It is always
            advisable to have nominees to keep your finances secure.
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
