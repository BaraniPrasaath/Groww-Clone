<div
  class="relative w-full max-w-4xl min-h-95 bg-white border border-gray-200 rounded-xl shadow-sm p-10 overflow-hidden flex items-center"
>
  <form (ngSubmit)="onSubmit()" class="w-full max-w-md z-10 flex flex-col gap-8">
    <div class="flex flex-col gap-1.5">
      <label class="text-[11px] font-bold tracking-wider text-slate-400 uppercase"> New PIN </label>
      <div class="relative w-full">
        <input
          [type]="showNewPin ? 'text' : 'password'"
          [(ngModel)]="newPin"
          name="newPin"
          placeholder="Enter PIN"
          class="w-full py-2 bg-transparent border-b border-slate-300 text-slate-700 placeholder-slate-400 focus:outline-none focus:border-emerald-500 transition-colors pr-14 text-sm"
          required
        />
        <button
          type="button"
          (click)="showNewPin = !showNewPin"
          class="absolute right-0 bottom-2 text-sm font-medium text-[#00b087] hover:text-[#009672] focus:outline-none"
        >
          {{ showNewPin ? 'Hide' : 'Show' }}
        </button>
      </div>
    </div>

    <div class="flex flex-col gap-1.5">
      <label class="text-[11px] font-bold tracking-wider text-slate-400 uppercase">
        Confirm New PIN
      </label>
      <div class="relative w-full">
        <input
          [type]="showConfirmPin ? 'text' : 'password'"
          [(ngModel)]="confirmPin"
          name="confirmPin"
          placeholder="Enter PIN"
          class="w-full py-2 bg-transparent border-b border-slate-300 text-slate-700 placeholder-slate-400 focus:outline-none focus:border-emerald-500 transition-colors pr-14 text-sm"
          required
        />
        <button
          type="button"
          (click)="showConfirmPin = !showConfirmPin"
          class="absolute right-0 bottom-2 text-sm font-medium text-[#00b087] hover:text-[#009672] focus:outline-none"
        >
          {{ showConfirmPin ? 'Hide' : 'Show' }}
        </button>
      </div>
    </div>

    <button
      type="submit"
      class="w-fit bg-[#00b087] hover:bg-[#009672] text-white font-medium text-sm px-5 py-2.5 rounded-lg transition-colors shadow-sm focus:outline-none mt-2"
    >
      Change Pin
    </button>
  </form>

  <div
    class="absolute right-0 top-0 bottom-0 w-1/2 bg-no-repeat bg-right bg-contain pointer-events-none"
    style="
      background-image: url('https://assets-netstorage.groww.in/web-assets/billion_groww_desktop/prod/_next/static/media/bg.5f4e9d68.svg');
    "
  ></div>
</div>
