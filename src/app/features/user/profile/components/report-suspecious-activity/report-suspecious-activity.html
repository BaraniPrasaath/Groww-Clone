<div class="w-full p-6 flex flex-col items-center border border-gray-200 rounded-lg">
  <div class="mb-6">
    <img
      src="https://assets-netstorage.groww.in/web-assets/billion_groww_desktop/prod/_next/static/media/errorImage.34beb745.svg"
      alt="Suspicious Activity"
      class="w-32 h-auto"
    />
  </div>

  <div class="text-center mb-8">
    <h1 class="text-xl font-semibold text-slate-800 mb-2">
      Found suspicious activity in your account?
    </h1>
    <p class="text-sm text-slate-500">
      You can protect your account by using any of these safety measures.
    </p>
  </div>

  <div class="w-full max-w-lg bg-white border border-gray-200 rounded-lg shadow-sm overflow-hidden mb-6">
    <button
      *ngFor="let action of securityActions; let last = last"
      (click)="handleAction(action.title)"
      [class.border-b]="!last"
      class="w-full px-6 py-5 flex items-center justify-between hover:bg-slate-50 transition-colors text-left border-gray-100"
    >
      <span class="font-medium text-slate-700">{{ action.title }}</span>
      <svg
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
        stroke-width="2"
        stroke="currentColor"
        class="w-4 h-4 text-slate-400"
      >
        <path stroke-linecap="round" stroke-linejoin="round" d="m8.25 4.5 7.5 7.5-7.5 7.5" />
      </svg>
    </button>
  </div>

  <div class="w-full max-w-lg bg-slate-50 p-6 rounded-xl border border-gray-200">
    <h3 class="font-semibold text-slate-800 mb-2">Report fraud</h3>
    <p class="text-sm text-slate-600">
      If you find anything suspicious, you can email us at
      <a href="mailto:cyberhelpline@groww.in" class="text-[#00b087] hover:underline"
        >cyberhelpline@groww.in</a
      >
      or call +91 8068249147.
    </p>
  </div>
</div>
