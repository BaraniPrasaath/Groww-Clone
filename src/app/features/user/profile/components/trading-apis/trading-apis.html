<div class="flex flex-col items-center justify-center min-h-150 w-full p-6 text-center">
  <!-- Illustration -->
  <div class="mb-8">
    <img
      src="https://assets-netstorage.groww.in/web-assets/billion_groww_desktop/prod/_next/static/media/desktopLight.4afdee4c.svg"
      alt="API Migration Illustration"
      class="w-64 h-auto"
    />
  </div>

  <!-- Content -->
  <div class="flex flex-col gap-2 max-w-sm">
    <h1 class="text-2xl font-semibold text-slate-800">Groww APIs have a new home!</h1>
    <p class="text-slate-500 text-sm">API keys are now available on Groww Cloud.</p>
  </div>

  <!-- Action Button -->
  <button
    (click)="redirectToCloud()"
    class="mt-8 bg-[#00b087] hover:bg-[#009672] text-white font-medium text-sm px-6 py-2.5 rounded-lg transition-colors shadow-sm"
  >
    Take me there
  </button>
</div>
