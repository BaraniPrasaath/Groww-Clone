<div
  class="w-full max-w-225 mx-auto bg-white border border-gray-100 rounded-xl p-6 shadow-sm font-sans antialiased text-[#1e293b]"
>
  <h2 class="text-xl font-bold mb-6 text-[#1e293b]">Similar stocks</h2>

  <div class="w-full overflow-x-auto custom-scrollbar pb-4 relative">
    <table class="w-full text-left border-collapse min-w-212.5">
      <thead>
        <tr
          class="text-[13px] text-[#64748b] font-medium border-b border-gray-100 whitespace-nowrap"
        >
          <th class="pb-3 pl-2 font-medium sticky left-0 bg-white z-20 sticky-col min-w-55">
            Stock
          </th>
          <th
            class="pb-3 px-4 font-medium min-w-37.5 text-right cursor-pointer group hover:text-[#1e293b]"
          >
            Mkt price (1D)
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="inline w-3 h-3 ml-1 text-gray-400 group-hover:text-gray-600"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M19 9l-7 7-7-7"
              />
            </svg>
          </th>
          <th class="pb-3 px-4 font-medium text-center min-w-50">52 week performance</th>
          <th
            class="pb-3 px-4 font-medium min-w-37.5 text-right cursor-pointer group hover:text-[#1e293b]"
          >
            Market cap
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="inline w-3 h-3 ml-1 text-gray-400 group-hover:text-gray-600"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M19 9l-7 7-7-7"
              />
            </svg>
          </th>
          <th class="pb-3 px-4 font-medium min-w-25 text-right">P/E ratio</th>
          <th class="pb-3 pl-4 pr-2 font-medium min-w-25 text-right">P/B ratio</th>
        </tr>
      </thead>

      <tbody>
        <tr
          *ngFor="let stock of stocks(); let last = last"
          [ngClass]="{ 'border-b border-gray-100': !last }"
          class="hover:bg-gray-50/50 transition-colors duration-150"
        >
          <td
            class="py-4 pl-2 sticky left-0 bg-white z-10 sticky-col group-hover:bg-gray-50/50 transition-colors duration-150"
          >
            <div class="flex items-center gap-3">
              <div
                class="w-8 h-8 rounded-full border border-gray-100 flex items-center justify-center overflow-hidden bg-white shrink-0"
              >
                <img [src]="stock.logoUrl" alt="logo" class="w-5 h-5 object-contain" />
              </div>
              <div class="flex flex-col">
                <span class="text-[15px] font-semibold text-[#1e293b]">{{ stock.name }}</span>
                <span class="text-[12px] text-[#94a3b8] font-medium tracking-wide mt-0.5">{{
                  stock.symbol
                }}</span>
              </div>
            </div>
          </td>

          <td class="py-4 px-4 text-right">
            <div class="text-[15px] font-medium text-[#1e293b]">₹{{ stock.price }}</div>
          </td>

          <td class="py-4 px-4">
            <div
              class="flex items-center justify-center gap-2 text-[12px] text-[#94a3b8] font-medium"
            >
              <span>L</span>
              <div class="w-32 h-px bg-gray-200 relative">
                <div
                  class="absolute top-1/2 -translate-y-1/2 w-0.5 h-2 bg-[#1e293b]"
                  [style.left.%]="stock.performancePosition"
                ></div>
              </div>
              <span>H</span>
            </div>
          </td>

          <td class="py-4 px-4 text-right text-[14px] text-[#1e293b] font-medium">
            {{ stock.marketCap }}
          </td>

          <td class="py-4 px-4 text-right text-[14px] text-[#1e293b] font-medium">
            {{ stock.peRatio }}
          </td>

          <td class="py-4 pl-4 pr-2 text-right text-[14px] text-[#1e293b] font-medium">
            {{ stock.pbRatio }}
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="mt-4 pt-2">
    <button
      class="flex items-center gap-1 text-[14px] text-[#64748b] font-medium hover:text-[#1e293b] transition-colors"
    >
      See more
      <svg
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
        stroke-width="2.5"
        stroke="currentColor"
        class="w-3.5 h-3.5 mt-0.5"
      >
        <path stroke-linecap="round" stroke-linejoin="round" d="m8.25 4.5 7.5 7.5-7.5 7.5" />
      </svg>
    </button>
  </div>
</div>
