<div class="w-full max-w-3xl mx-auto p-6 bg-white font-sans antialiased selection:bg-emerald-100">
  <div
    class="group flex items-center justify-between p-4 mb-6 border border-gray-100 rounded-xl shadow-sm hover:shadow-md hover:border-gray-200 transition-all duration-200 cursor-pointer"
  >
    <div class="flex items-center gap-4">
      <div
        class="w-12 h-12 flex items-center justify-center bg-[#f1f5f9] rounded-full text-[#475569]"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="2"
          stroke="currentColor"
          class="w-5 h-5"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 0 1 2.25-2.25h13.5A2.25 2.25 0 0 1 21 7.5v11.25m-18 0A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75m-18 0v-7.5A2.25 2.25 0 0 1 5.25 9h13.5A2.25 2.25 0 0 1 21 11.25v7.5"
          />
          <path stroke-linecap="round" stroke-linejoin="round" d="m8 15 3-2.5 3 2.5 3.5-3.5" />
        </svg>
      </div>

      <div class="flex flex-col">
        <h3 class="text-[17px] font-semibold text-[#1e293b] tracking-wide leading-tight">
          Create Stock SIP
        </h3>
        <p class="text-[13px] text-[#94a3b8] mt-0.5 font-medium">
          Automate your investments in this Stock
        </p>
      </div>
    </div>

    <div class="text-[#334155] group-hover:translate-x-0.5 transition-transform duration-200">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
        stroke-width="2.5"
        stroke="currentColor"
        class="w-4 h-4"
      >
        <path stroke-linecap="round" stroke-linejoin="round" d="m8.25 4.5 7.5 7.5-7.5 7.5" />
      </svg>
    </div>
  </div>

  <div class="flex items-center gap-8 border-b border-gray-100 overflow-x-auto scrollbar-none">
    <button
      *ngFor="let tab of tabs"
      (click)="setActiveTab(tab)"
      [ngClass]="{
        'text-[#00b087] border-[#00b087] font-semibold': activeTab === tab,
        'text-[#475569] border-transparent font-medium hover:text-[#1e293b]': activeTab !== tab,
      }"
      class="text-[15px] pb-3 border-b-2 -mb-px transition-all duration-200 whitespace-nowrap focus:outline-none"
    >
      {{ tab }}
    </button>
  </div>
</div>
