<div
  class="w-full max-w-212.5 mx-auto bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden font-sans"
>
  <div class="divide-y divide-gray-100">
    <div *ngFor="let news of newsItems()" class="p-6 hover:bg-gray-50 transition-colors duration-200">
      <div class="flex items-center gap-2 mb-2 text-[13px] text-[#64748b]">
        <span class="font-semibold text-[#475569]">{{ news.source }}</span>
        <span class="text-gray-300">•</span>
        <span>{{ news.timeAgo }}</span>
      </div>

      <p class="text-[15px] leading-[1.6] text-[#1e293b]">
        {{ news.headline }}
      </p>
    </div>
  </div>
</div>
