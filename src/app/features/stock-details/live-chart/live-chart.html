<div class="w-200 mx-10 p-4 bg-white font-sans antialiased text-[#2c3e50]">
  <div
    class="w-full flex items-center justify-between border border-gray-100 bg-white shadow-sm rounded-lg py-2.5 px-4 mb-6"
  >
    <div class="flex items-center gap-2 text-[13px] text-gray-500 font-normal">
      <svg class="w-4 h-4 text-gray-400 shrink-0" fill="currentColor" viewBox="0 0 20 20">
        <path
          fill-rule="evenodd"
          d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z"
          clip-rule="evenodd"
        ></path>
      </svg>
      <span>The current prices are delayed, activate stocks for live prices</span>
    </div>
    <button
      class="text-[12px] font-bold text-[#00b074] hover:text-[#009662] tracking-wide transition-colors"
    >
      ACTIVATE STOCKS
    </button>
  </div>

  <div class="flex items-start justify-between w-full mb-3">
    <div class="flex flex-col gap-1">
      <div
        class="w-12 h-12 rounded-xl bg-[#e3f2fd] flex items-center justify-center overflow-hidden p-1.5 border border-blue-50/50 mb-2"
      >
        <img [src]="displayLogo()" alt="Quess Corp Logo" class="w-full h-full object-contain" />
      </div>

      <div class="flex items-center gap-1 text-[11px] font-semibold text-slate-400 tracking-wider">
        <span>{{ stockData().nseScriptCode }} · NSE</span>
        <svg class="w-3 h-3 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2.5"
            d="M19 9l-7 7-7-7"
          ></path>
        </svg>
      </div>

      <h1 class="text-[22px] font-bold text-slate-800 tracking-tight leading-tight">
        {{ displayName() }}
      </h1>
    </div>

    <div class="flex items-center gap-3 mt-1">
      <button
        class="w-9 h-9 border border-gray-200 rounded-full flex items-center justify-center text-slate-600 hover:bg-slate-50 transition-colors"
      >
        <svg
          class="w-4.5 h-4.5"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M14.828 14.828a4 4 0 01-5.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0116 0z"
            class="hidden"
          ></path>
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"
          ></path>
        </svg>
      </button>
      <button
        class="w-9 h-9 border border-gray-200 rounded-full flex items-center justify-center text-slate-600 hover:bg-slate-50 transition-colors"
      >
        <svg
          class="w-4.5 h-4.5"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"
          ></path>
        </svg>
      </button>
    </div>
  </div>

  <div class="flex items-baseline gap-2 mb-4">
    <span class="text-3xl font-bold text-slate-800 tracking-tight">{{ stockData().price }}</span>
    <div
      class="flex items-center gap-1 text-[13px] font-medium"
      [ngClass]="changeVal() >= 0 ? 'text-[#00b074]' : 'text-[#ff4d4d]'"
    >
      <span>{{ this.changeVal() }} ({{ this.changePerc() }}%)</span>
      <span class="text-slate-400 font-normal ml-0.5 text-[11px]">{{
        this.activeTimeframe()
      }}</span>
    </div>
  </div>

  <div class="w-full relative mb-4 -ml-2">
    @if (chartOptions) {
      <apx-chart
        [series]="chartOptions.series!"
        [chart]="chartOptions.chart!"
        [xaxis]="chartOptions.xaxis!"
        [yaxis]="chartOptions.yaxis!"
        [stroke]="chartOptions.stroke!"
        [tooltip]="chartOptions.tooltip!"
        [dataLabels]="chartOptions.dataLabels!"
        [colors]="chartOptions.colors!"
        [fill]="chartOptions.fill!"
        [grid]="chartOptions.grid!"
      ></apx-chart>
    }
  </div>

  <div class="w-full border-t border-gray-100 pt-4 flex items-center justify-between">
    <div class="flex items-center gap-1.5">
      @for (tf of timeframes; track tf) {
        <button
          (click)="onTimeframeChange(tf)"
          [ngClass]="
            activeTimeframe() === tf
              ? 'border-slate-800 text-slate-800 font-semibold bg-transparent'
              : 'border-transparent text-slate-400 hover:text-slate-700 bg-transparent'
          "
          class="px-3 py-1 text-[12px] rounded-full border transition-all duration-150 focus:outline-none cursor-pointer"
        >
          {{ tf }}
        </button>
      }

      <button
        class="ml-1 w-8 h-8 rounded-full flex items-center justify-center text-slate-400 hover:bg-slate-50 transition-colors"
      >
        <svg
          class="w-4.5 h-4.5"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 002 2h2a2 2 0 002-2z"
          ></path>
        </svg>
      </button>
    </div>

    <button
      class="flex items-center gap-1.5 border border-gray-200 hover:bg-slate-50 transition-colors px-3 py-1.5 rounded-lg text-[12px] font-medium text-slate-600 focus:outline-none"
    >
      <span>Terminal</span>
      <svg
        class="w-3.5 h-3.5 text-slate-400"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        viewBox="0 0 24 24"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M7 12l3-3 3 3 4-4M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z"
        ></path>
      </svg>
    </button>
  </div>
  <div>
    <app-container-stock-details></app-container-stock-details>
  </div>
</div>
